name: ✨ Feature Request
description: Suggest an idea or enhancement for MovieNight.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make MovieNight better! Please describe your proposed feature or improvement below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Add support for subtitle track selection (.vtt / .srt files)...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: A clear description of any alternative solutions...

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - "Streaming Pipeline / Media Formats"
        - "WebRTC / Sync Engine"
        - "User Interface & Theater Mode"
        - "Audio & Webcam Grid"
        - "Room Governance & Security"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request here.
